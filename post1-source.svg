    <tspan x="90" dy="88">foundations.</tspan>
  </text>

  <line x1="90" y1="760" x2="300" y2="760" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>

  <text x="90" y="830" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="30" fill="#ffffff" opacity="0.92">

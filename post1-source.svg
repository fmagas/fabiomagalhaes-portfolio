  <text x="90" y="1080" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="26" fill="#ffffff" opacity="0.85" letter-spacing="1">HEADLESS REVENUE</text>
  <text x="90" y="1114" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="20" fill="#f0d69a" opacity="0.85">Revenue Systems &amp; AI Transformation for B2B SaaS</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#0d6b53"/>
      <stop offset="30%" stop-color="#1d8a6b"/>
      <stop offset="68%" stop-color="#3d4f79"/>
      <stop offset="100%" stop-color="#5d3f85"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0d69a" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#f0d69a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="llmBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d69a"/>
      <stop offset="100%" stop-color="#e8b768"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="340" fill="url(#glowGold)"/>

  <!-- Headline -->
  <text x="90" y="105" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="52" fill="#ffffff" letter-spacing="-1">
    <tspan x="90" dy="0">Everyone's chasing</tspan>
    <tspan x="90" dy="60">AI cost control.</tspan>
  </text>
  <text x="90" y="245" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="52" fill="#f0d69a" letter-spacing="-1">
    The real cost is governance.
  </text>

  <!-- Diagram: tools row on top, down to CRM foundation -->
  <!-- Tools row: where it actually shows up -->
  <text x="600" y="315" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="18" fill="#ffffff" opacity="0.7" text-anchor="middle" letter-spacing="1">WHERE IT SHOWS UP</text>

  <rect x="210" y="330" width="180" height="90" rx="10" fill="#ffffff"/>
  <rect x="210" y="330" width="180" height="6" rx="3" fill="#1d8a6b"/>
  <text x="300" y="382" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="22" fill="#171713" text-anchor="middle">Slack</text>

  <rect x="410" y="330" width="180" height="90" rx="10" fill="#ffffff"/>
  <rect x="410" y="330" width="180" height="6" rx="3" fill="#e8b768"/>
  <text x="500" y="382" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" fill="#171713" text-anchor="middle">Dashboards</text>

  <rect x="610" y="330" width="180" height="90" rx="10" fill="#ffffff"/>
  <rect x="610" y="330" width="180" height="6" rx="3" fill="#e88b74"/>
  <text x="700" y="382" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" fill="#171713" text-anchor="middle">Rep Tools</text>

  <rect x="810" y="330" width="180" height="90" rx="10" fill="#ffffff"/>
  <rect x="810" y="330" width="180" height="6" rx="3" fill="#9b8ec4"/>
  <text x="900" y="382" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="22" fill="#171713" text-anchor="middle">Portal</text>

  <line x1="600" y1="420" x2="600" y2="460" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
  <path d="M 592 444 L 600 430 L 608 444" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6"/>

  <!-- LLM layer -->
  <rect x="340" y="465" width="520" height="95" rx="12" fill="url(#llmBox)"/>
  <text x="600" y="522" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="30" fill="#171713" text-anchor="middle">LLM / AI Agents</text>

  <line x1="600" y1="560" x2="600" y2="600" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
  <path d="M 592 584 L 600 570 L 608 584" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6"/>

  <!-- Semantic layer -->
  <rect x="260" y="605" width="680" height="95" rx="12" fill="#ffffff" opacity="0.9"/>
  <text x="600" y="662" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="30" fill="#171713" text-anchor="middle">Semantic Layer</text>

  <line x1="600" y1="700" x2="600" y2="740" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
  <path d="M 592 724 L 600 710 L 608 724" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6"/>

  <!-- CRM foundation layer -->
  <rect x="200" y="745" width="800" height="115" rx="12" fill="#ffffff"/>
  <text x="600" y="812" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="32" fill="#171713" text-anchor="middle">CRM — System of Record</text>

  <text x="600" y="925" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="24" fill="#ffffff" opacity="0.85" text-anchor="middle">Governed from the foundation up — not bolted on after.</text>

  <!-- Bottom CTA + branding -->
  <text x="90" y="1055" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="36" fill="#ffffff">Start your headless strategy.</text>

  <text x="90" y="1120" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="24" fill="#ffffff" opacity="0.85" letter-spacing="1">HEADLESS REVENUE</text>
  <text x="90" y="1150" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="18" fill="#f0d69a" opacity="0.85">Revenue Systems &amp; AI Transformation for B2B SaaS</text>
</svg>
